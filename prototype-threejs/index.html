<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- véletlen ---------- */
const hash = s => { let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^= h >>> 16) >>> 0; };

const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const newCode = () => Array.from({ length: 6 }, () => 'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random() * 31)]).join('');

/* ---------- genom ---------- */
const HABITS = {
  arbor:     { label: 'terebélyes', height: 4.5, stems: 1, b0: 9,  b1: 6, b2: 5, a0: 44, a1: 38, a2: 36, r0: .56, r1: .55, r2: .62, s0: .40, s1: .12, s2: .12, t0: .10, t1: .16, t2: .10, t3: .06, wobble: .42, wind: 0,   taper: .36, flare: .55, crown: .68, leafDens: 13, thick: 1,   flowerOdds: .22 },
  weeping:   { label: 'szomorú',    height: 4.2, stems: 1, b0: 9,  b1: 6, b2: 5, a0: 56, a1: 40, a2: 22, r0: .60, r1: .78, r2: 1.05, s0: .52, s1: .06, s2: .05, t0: .14, t1: -.34, t2: -1.15, t3: -1.7, wobble: .3, wind: 0, taper: .40, flare: .5, crown: .25, leafDens: 19, thick: .95, flowerOdds: .12 },
  windswept: { label: 'szélfútta',  height: 3.4, stems: 1, b0: 7,  b1: 5, b2: 4, a0: 48, a1: 44, a2: 40, r0: .62, r1: .52, r2: .58, s0: .30, s1: .15, s2: .10, t0: .05, t1: .10, t2: .06, t3: .05, wobble: .95, wind: .42, taper: .32, flare: .8, crown: .5, leafDens: 15, thick: 1.25, flowerOdds: .28 },

const SKIES = [
  { name: 'aranyóra', zenith: '#1a2a52', horizon: '#f2a765', land: '#37351f', moss: '#6c7a39', sunColor: '#ffc78a', ambient: '#7f92c4', bounce: '#6a5336', dir: [.62, .30, -.62] },
  { name: 'hajnal',   zenith: '#25346a', horizon: '#f3b8b2', land: '#3a3c34', moss: '#74855a', sunColor: '#ffd2c4', ambient: '#92a4d8', bounce: '#6f5a5c', dir: [-.55, .26, -.68] },
  { name: 'pára',     zenith: '#274b52', horizon: '#c3d8c4', land: '#2c3d31', moss: '#5a7d58', sunColor: '#fff0d2', ambient: '#a3c6c3', bounce: '#51604c', dir: [.42, .62, -.50] },
  { name: 'alkony',   zenith: '#17123a', horizon: '#d9648c', land: '#2a2036', moss: '#4f5d55', sunColor: '#ff9f83', ambient: '#6a64b4', bounce: '#5a3853', dir: [.68, .20, -.55] },

function wildGenome(code) {
  const r = rng(hash(code));
  const names = Object.keys(HABITS);
  const habit = names[Math.floor(r() * names.length)];
  const G = { ...HABITS[habit] };
  delete G.label;
  for (const k of Object.keys(G)) if (typeof G[k] === 'number' && !INT_KEYS.includes(k)) G[k] *= .84 + r() * .32;
  G.code = code; G.seed = hash(code + 'g'); G.habit = HABITS[habit].label;
  const roll = r();
  G.leafH = roll < .56 ? .23 + r() * .13 : roll < .68 ? .08 + r() * .05 : roll < .77 ? .985 + r() * .03 : roll < .89 ? .44 + r() * .07 : .79 + r() * .06;
  G.leafH %= 1;
  G.leafTipH = (G.leafH + (r() - .5) * .14 + 1) % 1;
  G.leafS = .36 + r() * .34; G.leafL = .27 + r() * .16;
  G.leafLen = .28 + r() * .28; G.leafW = .14 + r() * .28; G.leafPow = .6 + r() * .9;
  G.leafLobes = r() < .35 ? 3 + Math.floor(r() * 4) : 0; G.leafFold = .1 + r() * .35; G.leafCurl = -.1 - r() * .4; G.leafUp = -.1 + r() * .35;
  G.barkH = r() < .84 ? .05 + r() * .06 : .6 + r() * .1; G.barkS = .12 + r() * .24; G.barkL = r() < .14 ? .5 + r() * .12 : .16 + r() * .14;
  G.petals = 4 + Math.floor(r() * 6); G.layers = r() < .4 ? 2 : 1;
  G.petalLen = .6 + r() * .5; G.petalW = .3 + r() * .4; G.petalCup = 12 + r() * 52;
  G.petalH = r(); G.petalTipH = (G.petalH + (r() - .5) * .22 + 1) % 1; G.petalS = .5 + r() * .45; G.petalL = .55 + r() * .28;
  G.centerH = .1 + r() * .08; G.flowerSize = .11 + r() * .13;
  G.windDir = r() * 6.283; G.sky = Math.floor(r() * SKIES.length);
  return G;
}

function crossGenome(a, b) {
  const code = a.code.slice(0, 3) + b.code.slice(0, 3);
  const r = rng(hash(code + a.seed + b.seed));
  const C = {};
  for (const k of Object.keys(a)) {
    if (typeof a[k] !== 'number' || k === 'seed') continue;
    const pick = r() < .5 ? a[k] : b[k];
    if (HUE_KEYS.includes(k)) {
      let d = ((b[k] - a[k] + 1.5) % 1) - .5;
      C[k] = (r() < .55 ? pick : (a[k] + d * r() + 1) % 1);
    } else if (INT_KEYS.includes(k)) C[k] = r() < .5 ? a[k] : b[k];
    else C[k] = lerp(pick, lerp(a[k], b[k], r()), .5) * (.96 + r() * .08);
  }
  C.sky = r() < .5 ? a.sky : b.sky;
  C.code = code; C.seed = hash(code + 'x'); C.habit = 'hibrid';
  C.parents = [a, b];

/* ---------- DNS-tábla: 0 = A=T, 1 = G≡C ---------- */
const N = 6;
const hasTriple = a => { for (let i = 0; i + 2 < a.length; i++) if (a[i] != null && a[i] === a[i + 1] && a[i] === a[i + 2]) return true; return false; };
const ROWS = [];
for (let m = 0; m < 64; m++) { const r = Array.from({ length: N }, (_, i) => m >> (N - 1 - i) & 1); if (r.reduce((a, b) => a + b) === 3 && !hasTriple(r)) ROWS.push(r); }
const rowIndex = new Map(ROWS.map((r, i) => [r.join(''), i]));
const BOARDS = (() => {
  const out = [], pick = [], cnt = new Array(N).fill(0);
  (function go(y) {
    if (y === N) { out.push(...pick); return; }
    for (let k = 0; k < ROWS.length; k++) {
      const r = ROWS[k]; let ok = true;
      for (let x = 0; x < N && ok; x++) {
        const ones = cnt[x] + r[x];
        if (ones > 3 || y + 1 - ones > 3) ok = false;
        else if (y >= 2 && ROWS[pick[y - 1]][x] === r[x] && ROWS[pick[y - 2]][x] === r[x]) ok = false;
      }
      if (!ok) continue;
      pick[y] = k; for (let x = 0; x < N; x++) cnt[x] += r[x];
      go(y + 1);
      for (let x = 0; x < N; x++) cnt[x] -= r[x];
    }
  })(0);
  return Uint8Array.from(out);
})();
const BOARD_COUNT = BOARDS.length / N;
const boardRows = b => Array.from(BOARDS.subarray(b * N, b * N + N));
const hamming = (a, b) => ROWS[a].reduce((d, v, i) => d + (v !== ROWS[b][i]), 0);

/* soronként és oszloponként levezethető mezők: ugyanaz, amit egy játékos is ki tud következtetni */
function deduce(cells) {
  const g = cells.map(r => r.slice());
  let changed = true;
  while (changed) {
    changed = false;
    for (let axis = 0; axis < 2; axis++) for (let i = 0; i < N; i++) {
      const get = j => axis ? g[j][i] : g[i][j];
      const fits = ROWS.filter(r => r.every((v, j) => get(j) == null || get(j) === v));
      if (!fits.length) return null;
      for (let j = 0; j < N; j++) if (get(j) == null && fits.every(r => r[j] === fits[0][j])) {
        if (axis) g[j][i] = fits[0][j]; else g[i][j] = fits[0][j];
        changed = true;
      }
    }
  }
  return g;
}

function makePuzzle(dna, R, emptyCells = 12) {
  const target = dna.map(k => ROWS[k].slice());
  const groups = new Map();
  for (let b = 0; b < BOARD_COUNT; b++) {
    const rows = boardRows(b), diff = [];
    for (let y = 0; y < N && diff.length < 3; y++) if (rows[y] !== dna[y]) diff.push(y);
    if (diff.length === 2) { const key = diff.join(','); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(rows); }
  }
  const clue = target.map(r => r.slice());
  let free = [];
  const keys = [...groups.keys()];
  if (keys.length) {
    const key = keys[Math.floor(R() * keys.length)];
    free = key.split(',').map(Number);
    for (const y of free) for (let x = 0; x < N; x++) if (groups.get(key).some(rows => ROWS[rows[y]][x] !== target[y][x])) clue[y][x] = null;
  }
  const order = [];
  for (let y = 0; y < N; y++) if (!free.includes(y)) for (let x = 0; x < N; x++) order.push([y, x]);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  let removed = 0;
  for (const [y, x] of order) {
    if (removed >= emptyCells) break;
    const keep = clue[y][x];
    clue[y][x] = null;
    const g = deduce(clue);
    const solved = g && g.every((row, yy) => free.includes(yy) || row.every(v => v != null));
    if (solved) removed++; else clue[y][x] = keep;
  }
  return { clue, free, target };
}

function nearestBoard(wanted, R) {
  let best = Infinity, ties = [];
  for (let b = 0; b < BOARD_COUNT; b++) {
    const rows = boardRows(b);
    let d = 0;
    for (let y = 0; y < N; y++) d += hamming(rows[y], wanted[y]);
    if (d < best) { best = d; ties = [b]; } else if (d === best) ties.push(b);
  }
  return boardRows(ties[Math.floor(R() * ties.length)]);
}

/* ---------- gének: minden sor egy tulajdonság, 14 változattal ---------- */
const GENES = ['Virágszín', 'Szirmok', 'Levél', 'Termet', 'Kéreg', 'Lomb'];
const FLOWER = [['korall', .02, .78, .64], ['cseresznye', .96, .72, .62], ['rózsa', .93, .75, .74], ['magenta', .87, .78, .58], ['ibolya', .77, .62, .64], ['orgona', .72, .55, .72], ['azúr', .58, .8, .64], ['türkiz', .5, .7, .58], ['menta', .43, .55, .72], ['citrom', .15, .85, .66], ['arany', .12, .9, .56], ['barack', .07, .85, .72], ['hófehér', .12, .25, .93], ['éjkék', .64, .7, .42]];
const FOLIAGE = [['smaragd', .40, .55, .32], ['fűzöld', .28, .55, .36], ['olíva', .2, .45, .32], ['almazöld', .24, .62, .44], ['kékeszöld', .47, .5, .32], ['türkiz', .5, .62, .42], ['ezüstös', .42, .18, .56], ['aranysárga', .13, .68, .46], ['borostyán', .09, .72, .42], ['rozsda', .05, .6, .34], ['bordó', .97, .52, .3], ['bíbor', .83, .4, .34], ['lila', .77, .42, .4], ['fenyő', .37, .42, .2]];
const BARK = [['hamu', .08, .08, .36], ['füst', .62, .08, .28], ['mogyoró', .07, .32, .3], ['dió', .06, .3, .2], ['ében', .05, .12, .11], ['réz', .05, .42, .3], ['vörösfenyő', .03, .36, .24], ['nyírfa', .12, .12, .62], ['ezüst', .6, .08, .54], ['homok', .1, .26, .46], ['moha', .25, .22, .24], ['palakék', .6, .2, .3], ['mahagóni', .01, .42, .2], ['szén', .6, .05, .14]];
const LEAF = [['keskeny', .34, .13, 1.1, 0], ['lándzsás', .46, .16, .85, 0], ['hosszú', .54, .2, 1, 0], ['ovális', .36, .26, 1, 0], ['kerek', .3, .38, 1, 0], ['szív alakú', .34, .36, .68, 0], ['csúcsos', .4, .25, 1.4, 0], ['széles', .4, .42, .9, 0], ['apró', .22, .24, 1, 0], ['karéjos', .38, .32, .95, 3], ['csipkés', .36, .3, 1, 6], ['tölgyes', .42, .3, .85, 5], ['ujjas', .4, .36, 1, 4], ['tollas', .5, .22, 1, 7]];
const TERMET = [['arbor', 'terebélyes', 1, 1], ['arbor', 'magas terebélyes', 1.18, .86], ['arbor', 'zömök terebélyes', .8, 1.28], ['weeping', 'szomorú', 1, 1], ['weeping', 'magas szomorú', 1.18, .88], ['weeping', 'törpe szomorú', .76, 1.18], ['windswept', 'szélfútta', 1, 1], ['windswept', 'magas szélfútta', 1.2, .85], ['windswept', 'göcsörtös', .82, 1.35], ['shrub', 'bokros', 1, 1], ['shrub', 'magas bokros', 1.28, .9], ['shrub', 'párnás', .7, 1.1], ['spire', 'oszlopos', 1, 1], ['spire', 'karcsú oszlopos', 1.15, .8]];
const petalAllele = k => { const petals = 4 + k % 6, layers = k >= 6 && k < 12 ? 2 : 1, cup = [15, 32, 48, 62][k % 4]; return { petals, layers, cup, name: `${petals}${layers === 2 ? ', telt' : ''}${cup >= 48 ? ', harangos' : ''}` }; };

function genomeFromDNA(dna, code, parents) {
  const r = rng(hash(dna.join('.') + code));
  const [flo, pet, lea, ter, kor, lom] = dna;
  const [habit, form, tall, stout] = TERMET[ter];
  const G = { ...HABITS[habit] };
  const label = G.label; delete G.label;
  for (const k of Object.keys(G)) if (typeof G[k] === 'number' && k !== 'stems') G[k] *= .93 + r() * .14;
  G.height *= tall; G.thick *= stout;
  G.dna = dna.slice(); G.code = code; G.seed = hash(code + dna.join('')); G.habit = label; G.form = form;
  if (parents) G.parents = parents;
  const f = FLOWER[flo], l = FOLIAGE[lom], b = BARK[kor], lf = LEAF[lea], p = petalAllele(pet);
  G.petalH = f[1]; G.petalTipH = (f[1] + (r() - .5) * .08 + 1) % 1; G.petalS = f[2]; G.petalL = f[3];
  G.petals = p.petals; G.layers = p.layers; G.petalCup = p.cup; G.petalLen = .72 + r() * .3; G.petalW = .38 + r() * .26;
  G.centerH = .11 + r() * .05; G.flowerSize = .12 + r() * .1;
  G.leafH = l[1]; G.leafTipH = (l[1] + (r() - .5) * .08 + 1) % 1; G.leafS = l[2]; G.leafL = l[3];
  G.leafLen = lf[1]; G.leafW = lf[2]; G.leafPow = lf[3]; G.leafLobes = lf[4];
  G.leafFold = .12 + r() * .3; G.leafCurl = -.1 - r() * .4; G.leafUp = -.1 + r() * .35;

}

const GENUS_A = ['Aur', 'Sil', 'Vel', 'Lun', 'Cor', 'Ther', 'Myr', 'Hel', 'Nym', 'Ast', 'Zeph', 'Ori', 'Cal', 'Thal', 'Eryn', 'Vio', 'Amar', 'Lys'];
const GENUS_B = ['and', 'ith', 'ol', 'an', 'er', 'ys', 'am', 'ion', 'ul', 'en'];
const GENUS_C = ['ia', 'ella', 'ora', 'ina', 'ara', 'ea', 'anthe'];
const HABIT_LATIN = { 'terebélyes': 'arborea', 'szomorú': 'pendula', 'szélfútta': 'ventosa', 'bokros': 'fruticosa', 'oszlopos': 'erecta', 'hibrid': 'hybrida' };

function latinName(G) {
  const r = rng(G.seed ^ 77);

  const genus = p(GENUS_A) + p(GENUS_B) + p(GENUS_C);
  return `${genus} ${G.parents ? 'hybrida' : (r() < .5 ? HABIT_LATIN[G.habit] : hueLatin(G.petalH))}`;
}
function traitsLine(G) {
  const birth = G.parents ? `szülők: ${G.parents[0].code} × ${G.parents[1].code}` : `DNS: ${G.code}`;
  return `${G.form} termet · ${alleleName(2, G.dna[2])} levél · ${alleleName(0, G.dna[0])} virág · ${alleleName(5, G.dna[5])} lomb · ${SKIES[G.sky].name}\n${birth}`;

/* ---------- növény felépítése ---------- */
const V3 = THREE.Vector3;
function perpendicular(d) { const a = Math.abs(d.y) < .9 ? new V3(0, 1, 0) : new V3(1, 0, 0); return new V3().crossVectors(d, a).normalize(); }

function generate(G, budget) {
  const R = rng(G.seed);
  const T = { pos: [], cen: [], prev: [], nor: [], birth: [], col: [], ring: [], idx: [], n: 0 };
  const leaves = [], flowers = [];
  const windV = new V3(Math.cos(G.windDir), 0, Math.sin(G.windDir));
  const bark = new THREE.Color().setHSL(G.barkH, G.barkS, G.barkL);
  const up = new V3(0, 1, 0);
  const maxLvl = G.b2 < .6 ? 2 : 3;
  const SIDES = [9, 6, 5, 3], STEP = [.2, .15, .12, .1];
  let twigs = 0, maxPath = 0;
  const maxTwigs = 1100 * budget, maxLeaves = 2600 * budget, maxFlowers = 260 * budget;
  const leafDens = G.leafDens * 1.4 * clamp(budget, .6, 1);

  function grow(p0, d0, len, rad, lvl, path) {
    if (++twigs > maxTwigs) return;
    const segs = clamp(Math.round(len / STEP[lvl]), 3, 28), step = len / segs;
    const phase = R() * 6.283, freq = .8 + R() * 1.5;
    const d = d0.clone().normalize(), n = perpendicular(d), p = p0.clone();
    const pts = [], ds = [], ns = [], rs = [], ps = [];
    const trop = G['t' + lvl];
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      let r = Math.max(rad * lerp(1, G.taper, t), .007);
      if (lvl === 0) r *= 1 + G.flare * Math.pow(1 - t, 7);
      pts.push(p.clone()); ds.push(d.clone()); ns.push(n.clone()); rs.push(r); ps.push(path + step * i);
      if (i === segs) break;
      const b = new V3().crossVectors(d, n);
      d.addScaledVector(n, Math.sin(phase + t * freq * 6.283) * G.wobble * step)
       .addScaledVector(b, Math.cos(phase * 1.7 + t * freq * 5.1) * G.wobble * step);
      d.y += trop * step;
      d.addScaledVector(windV, G.wind * step * (.4 + .6 * lvl));
      d.normalize();
      n.addScaledVector(d, -n.dot(d)).normalize();
      p.addScaledVector(d, step);
    }
    maxPath = Math.max(maxPath, ps[segs]);

    /* gyűrűk */
    const sides = SIDES[lvl], base = T.n;
    for (let i = 0; i <= segs; i++) {
      const c = pts[i], prev = pts[Math.max(0, i - 1)], b = new V3().crossVectors(ds[i], ns[i]);
      const shade = .86 + R() * .24;
      for (let s = 0; s < sides; s++) {
        const a = s / sides * 6.283;
        const nx = ns[i].x * Math.cos(a) + b.x * Math.sin(a), ny = ns[i].y * Math.cos(a) + b.y * Math.sin(a), nz = ns[i].z * Math.cos(a) + b.z * Math.sin(a);
        let r = rs[i];
        if (lvl === 0) r *= 1 + .22 * G.flare * Math.sin(a * 3 + phase) * Math.pow(1 - i / segs, 3);
        T.pos.push(c.x + nx * r, c.y + ny * r, c.z + nz * r);
        T.cen.push(c.x, c.y, c.z); T.prev.push(prev.x, prev.y, prev.z);
        T.nor.push(nx, ny, nz); T.birth.push(ps[i]); T.ring.push(Math.cos(a), Math.sin(a));
        const k = shade * (s % 2 ? .9 : 1.1);

    }
    for (let i = 0; i < segs; i++) for (let s = 0; s < sides; s++) {
      const a = base + i * sides + s, b = base + i * sides + (s + 1) % sides, c = a + sides, e = b + sides;
      T.idx.push(a, c, b, b, c, e);
    }
    T.n += (segs + 1) * sides;

    /* levelek, virágok */
    if (lvl >= maxLvl - 1 && leaves.length < maxLeaves) {
      const count = Math.round(len * leafDens * (lvl === maxLvl ? 1 : .4));
      let az = R() * 6.283;
      for (let k = 0; k < count; k++) {
        const t = lerp(.1, 1, (k + R()) / count), i = Math.min(segs, Math.floor(t * segs));
        const b = new V3().crossVectors(ds[i], ns[i]);
        const out = ns[i].clone().multiplyScalar(Math.cos(az)).addScaledVector(b, Math.sin(az));
        const dir = ds[i].clone().multiplyScalar(.45).addScaledVector(out, .85); dir.y += G.leafUp; dir.normalize();
        const nor = up.clone().addScaledVector(dir, -dir.y).add(new V3(R() - .5, R() - .5, R() - .5).multiplyScalar(.5));
        leaves.push({ p: pts[i], dir, nor, s: G.leafLen * (.65 + R() * .6) * (1 - .25 * t), path: ps[i], tint: R() });
        az += 2.39996;
      }
    }
    if (lvl === maxLvl) {
      if (flowers.length < maxFlowers && R() < G.flowerOdds) flowers.push({ p: pts[segs], dir: ds[segs].clone().multiplyScalar(.55).add(new V3(R() - .5, .7, R() - .5).multiplyScalar(.8)).normalize(), s: G.flowerSize * (.8 + R() * .4), path: ps[segs] });
      if (flowers.length < maxFlowers && R() < G.flowerOdds * .5) { const i = Math.floor(segs * (.3 + R() * .5)); flowers.push({ p: pts[i], dir: new V3(R() - .5, .9, R() - .5).normalize(), s: G.flowerSize * (.7 + R() * .35), path: ps[i] }); }
    }

    /* ágak */
    if (lvl < maxLvl) {
      const cnt = Math.round(G['b' + lvl]);
      const start = G['s' + lvl];
      let az = R() * 6.283;
      for (let c = 0; c < cnt; c++) {
        const u = (c + .2 + R() * .6) / cnt, t = lerp(start, .97, u), i = clamp(Math.floor(t * segs), 0, segs);
        const b = new V3().crossVectors(ds[i], ns[i]);
        const out = ns[i].clone().multiplyScalar(Math.cos(az)).addScaledVector(b, Math.sin(az));
        const a = G['a' + lvl] * Math.PI / 180 * (.8 + R() * .4);
        const cd = ds[i].clone().multiplyScalar(Math.cos(a)).addScaledVector(out, Math.sin(a));
        const profile = lerp(1, 1 - u * .8, G.crown);
        grow(pts[i], cd, len * G['r' + lvl] * profile * (.8 + R() * .4), rs[i] * (lvl === 0 ? .62 : .68), lvl + 1, ps[i] + .02);
        az += 2.39996 + (R() - .5) * .4;
      }
    }
  }

  const stems = Math.max(1, Math.round(G.stems));
  for (let s = 0; s < stems; s++) {
    const a = s / stems * 6.283 + R();
    const splay = stems > 1 ? .22 + R() * .3 : .04 + G.wind * .5;
    const dir = new V3(Math.cos(a) * splay, 1, Math.sin(a) * splay);
    const off = stems > 1 ? new V3(Math.cos(a) * .12, 0, Math.sin(a) * .12) : new V3();
    off.y = -.06;
    grow(off, dir, G.height * (stems > 1 ? .75 + R() * .35 : 1), G.height * .055 * G.thick, 0, 0);
  }

  return { T, leaves, flowers, maxPath };
}

/* ---------- megosztott shader-darabok ---------- */
const SWAY = `
uniform float uTime, uH, uAmp;
vec3 sway(vec3 p){
  float h = max(p.y, 0.) / uH;
  float a = h * h * uAmp;
  return vec3(sin(uTime * .7 + p.y * .4 + p.z * .3) * a + sin(uTime * 1.7 + p.x * 1.3) * a * .22, 0., cos(uTime * .6 + p.x * .35) * a * .7);
}`;
const SHADE = `
uniform vec3 uSun, uSunCol, uAmbient, uBounce;
vec3 shade(vec3 alb, vec3 N, vec3 V, float trans){
  float ndl = dot(N, uSun);
  float wrap = pow(clamp(ndl * .5 + .5, 0., 1.), 1.7);
  vec3 c = alb * (mix(uBounce, uAmbient, N.y * .5 + .5) * .88 + uSunCol * wrap * 1.15);
  float back = pow(clamp(dot(-V, uSun), 0., 1.), 2.5) * (.45 + .55 * clamp(-ndl, 0., 1.));
  c += alb * uSunCol * back * trans * 2.1;
  c += uAmbient * pow(1. - clamp(dot(N, V), 0., 1.), 3.) * .10;
  return c;
}`;

{ const a = new Float32Array(POLLEN * 3), ph = new Float32Array(POLLEN), r = rng(7);

/* anyagok */
const FOLIAGE_VS = `
attribute float aBirth, aT, aAcross, aKind, aAO; attribute vec3 aTint;
uniform float uGrow, uFlut, uBud; varying vec3 vN, vW, vTint; varying float vT, vAcross, vKind, vAO;

/* levél és virág geometria */
function makeLeafGeometry(G) {
  const rows = 6, pos = [], ts = [], acr = [], idx = [];
  const width = t => {
    let w = Math.pow(Math.sin(Math.PI * Math.pow(t, G.leafPow)), .8) * G.leafW;
    if (G.leafLobes) w *= .76 + .24 * Math.abs(Math.sin(t * Math.PI * G.leafLobes));

  };

    const t = i / rows, w = width(t), z = G.leafCurl * t * t;
    pos.push(-w, t, z + G.leafFold * w, 0, t, z, w, t, z + G.leafFold * w);
    ts.push(t, t, t); acr.push(1, 0, 1);
  }
  for (let i = 0; i < rows; i++) { const a = i * 3; for (let s = 0; s < 2; s++) idx.push(a + s, a + s + 1, a + s + 3, a + s + 1, a + s + 4, a + s + 3); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aT', new THREE.Float32BufferAttribute(ts, 1));

  if (acc >= 1) {
    const fps = Math.round(frames / acc);
    stats.textContent = `${fps} fps · ${Math.round(frameMs)} ms · ${Math.round(renderer.info.render.triangles / 1000)}k`;
    if (!boardOpen && !interacting && !H && fps < 24) { if (++slow >= 3 && pixelRatio > 1) { pixelRatio = Math.max(1, pixelRatio - .25); resize(); slow = 0; } } else slow = 0;
    frames = 0; acc = 0;
  }
}

/* ellenőrző horog */
window.__garden = {
  boards: BOARD_COUNT, rows: ROWS.length,
  stats(n) {
    const R = rng(123); let empties = 0, minE = 99, maxE = 0, withFree = 0, broken = 0, alts = 0;
    for (let i = 0; i < n; i++) {
      const dna = boardRows(Math.floor(R() * BOARD_COUNT));
      const P = makePuzzle(dna, R);
      const e = P.clue.flat().filter(v => v == null).length;
      empties += e; minE = Math.min(minE, e); maxE = Math.max(maxE, e);
      if (P.free.length) withFree++;
      const d = deduce(P.clue);
      if (!d || !d.every((row, y) => P.free.includes(y) || row.every((v, x) => v === P.target[y][x]))) broken++;
      let m = 0;
      for (let b = 0; b < BOARD_COUNT; b++) { const rows = boardRows(b); if (rows.every((k, y) => ROWS[k].every((v, x) => P.clue[y][x] == null || P.clue[y][x] === v))) { m++; if (!rows.every((k, y) => P.free.includes(y) || k === dna[y])) broken++; } }
      if (m >= 2) alts++;
    }
    return { n, avgEmpty: empties / n, minE, maxE, withFree, multipleChoices: alts, broken };
  },
  solveBoard() { B.grid = B.target.map(r => r.slice()); updateBoard(); },
  dna: () => current.dna, phase: () => H ? H.t : null, grow: () => grow,
  plantDNA(dna, code) { previous = current; plantIt(genomeFromDNA(dna, code || 'teszt')); grow = 1; growTarget = 1; },
  setGrow(v) { grow = v; growTarget = v; }, stopRotate() { controls.autoRotate = false; },
};

plantIt(genomeFromDNA(nearestBoard([2, 5, 1, 3, 0, 5], rng(3)), 'kert01'));
requestAnimationFrame(tick);
